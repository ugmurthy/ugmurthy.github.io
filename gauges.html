<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoSattelite - Sensor Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 16px;
    }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    h1 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, #00d4ff, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      font-size: 0.85rem;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff6b6b;
      animation: pulse 2s infinite;
    }
    
    .status-dot.connected { background: #51cf66; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .connect-btn {
      display: block;
      margin: 16px auto;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(90deg, #00d4ff, #7b2cbf);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .connect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,212,255,0.4);
    }
    
    .connect-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      opacity: 0.3;
      transition: opacity 0.5s;
    }
    
    .dashboard.active { opacity: 1; }
    
    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-title::before {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }
    
    .card.imu .card-title::before { background: #ff6b6b; }
    .card.gyro .card-title::before { background: #ffd43b; }
    .card.mag .card-title::before { background: #74c0fc; }
    .card.env .card-title::before { background: #51cf66; }
    .card.prox .card-title::before { background: #cc5de8; }
    .card.color .card-title::before { background: #ffffff; }
    
    .gauges-row {
      display: flex;
      justify-content: space-around;
      gap: 8px;
    }
    
    .gauge-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    
    .gauge {
      position: relative;
      width: 70px;
      height: 70px;
    }
    
    .gauge svg {
      transform: rotate(-90deg);
      width: 70px;
      height: 70px;
    }
    
    .gauge-bg {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 6;
    }
    
    .gauge-fill {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }
    
    .gauge-fill.acc { stroke: #ff6b6b; }
    .gauge-fill.gyro { stroke: #ffd43b; }
    .gauge-fill.mag { stroke: #74c0fc; }
    .gauge-fill.env { stroke: #51cf66; }
    .gauge-fill.prox { stroke: #cc5de8; }
    
    .gauge-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    
    .gauge-value {
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Courier New', monospace;
    }
    
    .gauge-label {
      font-size: 0.6rem;
      color: #666;
    }
    
    .single-gauge {
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }
    
    .single-gauge .gauge {
      width: 120px;
      height: 120px;
    }
    
    .single-gauge .gauge svg {
      width: 120px;
      height: 120px;
    }
    
    .single-gauge .gauge-bg {
      stroke-width: 10;
    }
    
    .single-gauge .gauge-fill {
      stroke-width: 10;
    }
    
    .single-gauge .gauge-value {
      font-size: 1.4rem;
    }
    
    .color-preview {
      width: 100%;
      height: 50px;
      border-radius: 8px;
      margin-top: 12px;
      border: 2px solid rgba(255,255,255,0.2);
    }
    
    .env-gauges {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .env-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .env-gauge-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    
    .env-gauge-mini {
      width: 40px;
      height: 40px;
      position: relative;
    }
    
    .env-gauge-mini svg {
      transform: rotate(-90deg);
      width: 40px;
      height: 40px;
    }
    
    .env-gauge-mini .gauge-bg,
    .env-gauge-mini .gauge-fill {
      stroke-width: 4;
    }
    
    .env-gauge-mini .gauge-fill { stroke: #51cf66; }
    
    .env-value {
      font-family: 'Courier New', monospace;
      font-weight: 600;
    }
    
    .env-label {
      font-size: 0.65rem;
      color: #666;
    }
    
    .json-viewer {
      margin-top: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    @media (min-width: 600px) {
      .dashboard {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .gauge { width: 80px; height: 80px; }
      .gauge svg { width: 80px; height: 80px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NanoSattelite</h1>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
    </header>
    
    <button class="connect-btn" id="connectBtn">Connect to NanoSattelite</button>
    
    <div class="dashboard" id="dashboard">
      <div class="card imu">
        <div class="card-title">Accelerometer (g)</div>
        <div class="gauges-row">
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill acc" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="accXGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="accX">--</div>
                <div class="gauge-label">X</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill acc" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="accYGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="accY">--</div>
                <div class="gauge-label">Y</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill acc" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="accZGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="accZ">--</div>
                <div class="gauge-label">Z</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card gyro">
        <div class="card-title">Gyroscope (°/s)</div>
        <div class="gauges-row">
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill gyro" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="gyroXGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="gyroX">--</div>
                <div class="gauge-label">X</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill gyro" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="gyroYGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="gyroY">--</div>
                <div class="gauge-label">Y</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill gyro" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="gyroZGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="gyroZ">--</div>
                <div class="gauge-label">Z</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card mag">
        <div class="card-title">Magnetometer (µT)</div>
        <div class="gauges-row">
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill mag" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="magXGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="magX">--</div>
                <div class="gauge-label">X</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill mag" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="magYGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="magY">--</div>
                <div class="gauge-label">Y</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill mag" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="176" id="magZGauge"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="magZ">--</div>
                <div class="gauge-label">Z</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card env">
        <div class="card-title">Environmental</div>
        <div class="env-gauges">
          <div class="env-row">
            <div class="env-gauge-container">
              <div class="env-gauge-mini">
                <svg viewBox="0 0 40 40">
                  <circle class="gauge-bg" cx="20" cy="20" r="15"></circle>
                  <circle class="gauge-fill env" cx="20" cy="20" r="15" 
                    stroke-dasharray="94" stroke-dashoffset="94" id="tempGauge"></circle>
                </svg>
              </div>
              <div>
                <div class="env-value" id="temp">--</div>
                <div class="env-label">Temp °C</div>
              </div>
            </div>
            <div class="env-gauge-container">
              <div class="env-gauge-mini">
                <svg viewBox="0 0 40 40">
                  <circle class="gauge-bg" cx="20" cy="20" r="15"></circle>
                  <circle class="gauge-fill env" cx="20" cy="20" r="15" 
                    stroke-dasharray="94" stroke-dashoffset="94" id="humidityGauge"></circle>
                </svg>
              </div>
              <div>
                <div class="env-value" id="humidity">--</div>
                <div class="env-label">Humidity %</div>
              </div>
            </div>
          </div>
          <div class="env-row">
            <div class="env-gauge-container">
              <div class="env-gauge-mini">
                <svg viewBox="0 0 40 40">
                  <circle class="gauge-bg" cx="20" cy="20" r="15"></circle>
                  <circle class="gauge-fill env" cx="20" cy="20" r="15" 
                    stroke-dasharray="94" stroke-dashoffset="94" id="pressureGauge"></circle>
                </svg>
              </div>
              <div>
                <div class="env-value" id="pressure">--</div>
                <div class="env-label">Pressure hPa</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card prox">
        <div class="card-title">Proximity</div>
        <div class="single-gauge">
          <div class="gauge">
            <svg viewBox="0 0 70 70">
              <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
              <circle class="gauge-fill prox" cx="35" cy="35" r="28" 
                stroke-dasharray="176" stroke-dashoffset="176" id="proxGauge"></circle>
            </svg>
            <div class="gauge-center">
              <div class="gauge-value" id="proximity">--</div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card color">
        <div class="card-title">Color (RGB)</div>
        <div class="gauges-row">
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="0" id="colorRGauge" style="stroke: #ff6b6b"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="colorR">--</div>
                <div class="gauge-label">R</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="0" id="colorGGauge" style="stroke: #51cf66"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="colorG">--</div>
                <div class="gauge-label">G</div>
              </div>
            </div>
          </div>
          <div class="gauge-container">
            <div class="gauge">
              <svg viewBox="0 0 70 70">
                <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                <circle class="gauge-fill" cx="35" cy="35" r="28" 
                  stroke-dasharray="176" stroke-dashoffset="0" id="colorBGauge" style="stroke: #74c0fc"></circle>
              </svg>
              <div class="gauge-center">
                <div class="gauge-value" id="colorB">--</div>
                <div class="gauge-label">B</div>
              </div>
            </div>
          </div>
        </div>
        <div class="color-preview" id="colorPreview"></div>
      </div>
    </div>
    
    <div class="json-viewer" id="jsonViewer"></div>
  </div>

  <script>
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_TX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const connectBtn = document.getElementById('connectBtn');
    const dashboard = document.getElementById('dashboard');
    const jsonViewer = document.getElementById('jsonViewer');

    let bluetoothDevice = null;
    let nusTxCharacteristic = null;

    const gaugeConfigs = {
      accX: { max: 2, element: 'accXGauge' },
      accY: { max: 2, element: 'accYGauge' },
      accZ: { max: 2, element: 'accZGauge' },
      gyroX: { max: 500, element: 'gyroXGauge' },
      gyroY: { max: 500, element: 'gyroYGauge' },
      gyroZ: { max: 500, element: 'gyroZGauge' },
      magX: { max: 100, element: 'magXGauge' },
      magY: { max: 100, element: 'magYGauge' },
      magZ: { max: 100, element: 'magZGauge' },
      temp: { max: 50, element: 'tempGauge', circumference: 94 },
      humidity: { max: 100, element: 'humidityGauge', circumference: 94 },
      pressure: { max: 1100, element: 'pressureGauge', circumference: 94 },
      proximity: { max: 255, element: 'proxGauge' },
      colorR: { max: 255, element: 'colorRGauge' },
      colorG: { max: 255, element: 'colorGGauge' },
      colorB: { max: 255, element: 'colorBGauge' }
    };

    function updateGauge(id, value) {
      const config = gaugeConfigs[id];
      if (!config) return;
      
      const circumference = config.circumference || 176;
      const normalized = Math.min(Math.abs(value) / config.max, 1);
      const offset = circumference - (normalized * circumference);
      
      const gauge = document.getElementById(config.element);
      if (gauge) {
        gauge.style.strokeDashoffset = offset;
      }
    }

    function updateSensorDisplay(data) {
      if (data.acc) {
        if (data.acc.x !== undefined) {
          document.getElementById('accX').textContent = data.acc.x.toFixed(2);
          updateGauge('accX', data.acc.x);
        }
        if (data.acc.y !== undefined) {
          document.getElementById('accY').textContent = data.acc.y.toFixed(2);
          updateGauge('accY', data.acc.y);
        }
        if (data.acc.z !== undefined) {
          document.getElementById('accZ').textContent = data.acc.z.toFixed(2);
          updateGauge('accZ', data.acc.z);
        }
      }
      if (data.gyro) {
        if (data.gyro.x !== undefined) {
          document.getElementById('gyroX').textContent = data.gyro.x.toFixed(0);
          updateGauge('gyroX', data.gyro.x);
        }
        if (data.gyro.y !== undefined) {
          document.getElementById('gyroY').textContent = data.gyro.y.toFixed(0);
          updateGauge('gyroY', data.gyro.y);
        }
        if (data.gyro.z !== undefined) {
          document.getElementById('gyroZ').textContent = data.gyro.z.toFixed(0);
          updateGauge('gyroZ', data.gyro.z);
        }
      }
      if (data.mag) {
        if (data.mag.x !== undefined) {
          document.getElementById('magX').textContent = data.mag.x.toFixed(1);
          updateGauge('magX', data.mag.x);
        }
        if (data.mag.y !== undefined) {
          document.getElementById('magY').textContent = data.mag.y.toFixed(1);
          updateGauge('magY', data.mag.y);
        }
        if (data.mag.z !== undefined) {
          document.getElementById('magZ').textContent = data.mag.z.toFixed(1);
          updateGauge('magZ', data.mag.z);
        }
      }
      if (data.temp !== undefined) {
        document.getElementById('temp').textContent = data.temp.toFixed(1);
        updateGauge('temp', data.temp);
      }
      if (data.humidity !== undefined) {
        document.getElementById('humidity').textContent = data.humidity.toFixed(0);
        updateGauge('humidity', data.humidity);
      }
      if (data.pressure !== undefined) {
        document.getElementById('pressure').textContent = data.pressure.toFixed(0);
        updateGauge('pressure', data.pressure);
      }
      if (data.proximity !== undefined) {
        document.getElementById('proximity').textContent = data.proximity;
        updateGauge('proximity', data.proximity);
      }
      if (data.color) {
        if (data.color.r !== undefined) {
          document.getElementById('colorR').textContent = data.color.r;
          updateGauge('colorR', data.color.r);
        }
        if (data.color.g !== undefined) {
          document.getElementById('colorG').textContent = data.color.g;
          updateGauge('colorG', data.color.g);
        }
        if (data.color.b !== undefined) {
          document.getElementById('colorB').textContent = data.color.b;
          updateGauge('colorB', data.color.b);
        }
        if (data.color.r !== undefined && data.color.g !== undefined && data.color.b !== undefined) {
          document.getElementById('colorPreview').style.background = 
            `rgb(${data.color.r},${data.color.g},${data.color.b})`;
        }
      }
    }

    function handleDataReceived(event) {
      const decoder = new TextDecoder();
      const value = decoder.decode(event.target.value);
      const lines = value.split('\n').filter(line => line.trim());
      
      lines.forEach(line => {
        try {
          const data = JSON.parse(line);
          updateSensorDisplay(data);
          jsonViewer.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          console.log('Invalid JSON:', line);
        }
      });
    }

    async function connect() {
      try {
        connectBtn.disabled = true;
        connectBtn.textContent = 'Scanning...';
        
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'NanoSattelite' }],
          optionalServices: [NUS_SERVICE_UUID]
        });
        
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
        connectBtn.textContent = 'Connected!';
        
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        
        nusTxCharacteristic = await service.getCharacteristic(NUS_TX_UUID);
        await nusTxCharacteristic.startNotifications();
        nusTxCharacteristic.addEventListener('characteristicvaluechanged', handleDataReceived);
        
        dashboard.classList.add('active');
        
        bluetoothDevice.addEventListener('gattserverdisconnected', disconnect);
        
      } catch (error) {
        console.error('Connection error:', error);
        alert('Failed to connect: ' + error.message);
        disconnect();
      }
    }
    
    function disconnect() {
      statusDot.classList.remove('connected');
      statusText.textContent = 'Disconnected';
      connectBtn.disabled = false;
      connectBtn.textContent = 'Connect to NanoSattelite';
      dashboard.classList.remove('active');
      
      if (nusTxCharacteristic) {
        nusTxCharacteristic.removeEventListener('characteristicvaluechanged', handleDataReceived);
        nusTxCharacteristic = null;
      }
      if (bluetoothDevice) {
        bluetoothDevice.removeEventListener('gattserverdisconnected', disconnect);
        bluetoothDevice = null;
      }
    }
    
    connectBtn.addEventListener('click', connect);
  </script>
</body>
</html>

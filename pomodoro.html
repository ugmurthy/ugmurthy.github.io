<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomo-VX: Neon Glassmorphism Pomodoro Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0f0f23 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                          radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                          radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      50% { transform: scale(1.05) rotate(180deg); opacity: 1; }
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .glass-card {
      backdrop-filter: blur(25px) saturate(180%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      max-width: 90vw;
      position: relative;
    }

    .glass-card:hover {
      transform: translateY(-8px);
      box-shadow: 
        0 35px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    #mode {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .work #mode {
      color: #ff6b6b;
      text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;
    }

    .break #mode {
      color: #51cf66;
      text-shadow: 0 0 20px #51cf66, 0 0 40px #51cf66;
    }

    #timer {
      font-size: clamp(3.5rem, 10vw, 6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      text-shadow: 
        0 0 20px rgba(0, 255, 255, 0.8),
        0 0 40px rgba(0, 255, 255, 0.4);
      margin: 1.5rem 0 2rem;
      letter-spacing: -2px;
      transition: all 0.3s ease;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .controls button {
      width: 70px;
      height: 70px;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .controls button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .controls button:hover::before {
      left: 100%;
    }

    .controls button:hover {
      transform: scale(1.1) translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .controls button:active {
      transform: scale(0.95);
    }

    svg {
      width: 28px;
      height: 28px;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px currentColor);
      transition: filter 0.3s ease;
    }

    #play svg { stroke: #00ffff; filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 20px #00ffff); }
    #pause svg { stroke: #ffd43b; filter: drop-shadow(0 0 10px #ffd43b) drop-shadow(0 0 20px #ffd43b); }
    #reset svg { stroke: #ff00ff; filter: drop-shadow(0 0 10px #ff00ff) drop-shadow(0 0 20px #ff00ff); }

    .controls button:hover svg {
      filter: drop-shadow(0 0 15px currentColor) drop-shadow(0 0 30px currentColor);
    }

    @media (max-width: 480px) {
      .glass-card {
        padding: 2rem 1.5rem;
        border-radius: 24px;
      }
      .controls {
        gap: 1rem;
      }
      .controls button {
        width: 60px;
        height: 60px;
      }
      svg {
        width: 24px;
        height: 24px;
      }
    }

    .running #timer {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.4); }
      50% { text-shadow: 0 0 30px rgba(0, 255, 255, 1), 0 0 60px rgba(0, 255, 255, 0.6); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card" id="glassCard">
      <div id="mode">Work</div>
      <div id="timer">25:00</div>
      <div class="controls">
        <button id="play" title="Start / Resume">
          <svg viewBox="0 0 24 24">
            <polygon points="5,3 5,21 16,12"></polygon>
          </svg>
        </button>
        <button id="pause" title="Pause">
          <svg viewBox="0 0 24 24">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
        <button id="reset" title="Reset">
          <svg viewBox="0 0 24 24">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    class PomodoroClock {
      constructor() {
        this.time = 25 * 60;
        this.isRunning = false;
        this.interval = null;
        this.isWork = true;
        this.audioCtx = null;

        this.elements = {
          glassCard: document.getElementById('glassCard'),
          mode: document.getElementById('mode'),
          timer: document.getElementById('timer'),
          play: document.getElementById('play'),
          pause: document.getElementById('pause'),
          reset: document.getElementById('reset')
        };

        this.bindEvents();
        this.updateDisplay();
      }

      bindEvents() {
        this.elements.play.onclick = () => this.toggle();
        this.elements.pause.onclick = () => this.pause();
        this.elements.reset.onclick = () => this.reset();
      }

      updateDisplay() {
        const min = Math.floor(this.time / 60);
        const sec = this.time % 60;
        this.elements.timer.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        this.elements.mode.textContent = this.isWork ? 'Work' : 'Break';
        this.elements.glassCard.className = this.isWork ? 'glass-card work' : 'glass-card break';
      }

      toggle() {
        if (this.isRunning) {
          this.pause();
        } else {
          this.start();
        }
      }

      start() {
        if (!this.isRunning) {
          this.elements.glassCard.classList.add('running');
          this.interval = setInterval(() => {
            this.time--;
            this.updateDisplay();
            if (this.time <= 0) {
              this.switchSession();
            }
          }, 1000);
          this.isRunning = true;
        }
      }

      pause() {
        if (this.isRunning) {
          clearInterval(this.interval);
          this.isRunning = false;
          this.elements.glassCard.classList.remove('running');
        }
      }

      reset() {
        this.pause();
        this.isWork = true;
        this.time = 25 * 60;
        this.updateDisplay();
      }

      switchSession() {
        this.isWork = !this.isWork;
        this.time = this.isWork ? 25 * 60 : 5 * 60;
        this.updateDisplay();
        this.playBeep();
      }

      playBeep() {
        if (!this.audioCtx) {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const oscillator = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);
        oscillator.frequency.value = this.isWork ? 800 : 600;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.6);
        oscillator.start(this.audioCtx.currentTime);
        oscillator.stop(this.audioCtx.currentTime + 0.6);
      }
    }

    // Initialize
    new PomodoroClock();
  </script>
</body>
</html>
